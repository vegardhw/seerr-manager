name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Syntax check
        run: python -m py_compile backend/main.py

      - name: Import check
        env:
          SEERR_URL: http://dummy
          SEERR_API_KEY: dummy
          TMDB_API_KEY: dummy
          APP_SECRET: dummy-ci-secret
        run: python -c "import sys; sys.path.insert(0, 'backend'); import main"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seerr-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name seerr-ci \
            -e SEERR_URL=http://dummy \
            -e SEERR_API_KEY=dummy \
            -e TMDB_API_KEY=dummy \
            -e APP_SECRET=ci-test-secret \
            --health-cmd='wget -qO- http://127.0.0.1:8765/ || exit 1' \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            --health-start-period=15s \
            seerr-manager:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 18); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' seerr-ci)
            echo "[$i/18] Health status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container became unhealthy."
              docker logs seerr-ci
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for container to become healthy."
          docker logs seerr-ci
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs seerr-ci
